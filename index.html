<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sorteio de Participantes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #fff;
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
    }
    #resultado {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
      color: #006400;
    }
  </style>
</head>
<body>
  <h1>Sorteio de Participantes</h1>
  
  <input type="text" id="nome" placeholder="Digite o nome do participante">
  <button onclick="adicionarParticipante()">Adicionar</button>
  <button onclick="sortearParticipante()">Sortear</button>
  
  <h2>Lista de Participantes</h2>
  <ul id="lista"></ul>
  
  <div id="resultado"></div>
  
  <script>
    const participantes = [];
    
    function adicionarParticipante() {
      const nomeInput = document.getElementById("nome");
      const nome = nomeInput.value.trim();
      
      if (nome === "") {
        alert("Por favor, digite um nome válido!");
        return;
      }
      
      participantes.push(nome);
      atualizarLista();
      nomeInput.value = "";
    }
    
    function atualizarLista() {
      const lista = document.getElementById("lista");
      lista.innerHTML = "";
      participantes.forEach((p, i) => {
        const li = document.createElement("li");
        li.textContent = `${i + 1}. ${p}`;
        lista.appendChild(li);
      });
    }
    
    function sortearParticipante() {
      if (participantes.length === 0) {
        alert("Nenhum participante cadastrado!");
        return;
      }
      
      const indice = Math.floor(Math.random() * participantes.length);
      const sorteado = participantes[indice];
      
      document.getElementById("resultado").textContent = 
        `🎉 O participante sorteado foi: ${sorteado}`;
    }
  </script>
</body>
</html>
